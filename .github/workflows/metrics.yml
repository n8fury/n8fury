name: Generate Github Metrics

# SLOT 2 of 3 — one hour after waka. Was previously sharing waka's cron slot,
# which is what broke the README for three months: this job finished in ~2 min
# and pushed github-metrics.svg while waka was still generating, leaving waka's
# clone stale and its push rejected.
on:
  schedule:
    - cron: '0 1 1,15 * *' # 01:00 UTC
  workflow_dispatch:

concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Pinned: @latest is a moving tag and gives you no signal when upstream
      # changes break the run.
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GH_TOKEN }}

          # Options
          user: n8fury
          template: classic
          base: activity, community, repositories, metadata
          base_indepth: yes
          config_display: large
          config_octicon: yes
          config_timezone: Asia/Dhaka
          config_twemoji: yes
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: repositories
          plugin_habits: yes
          plugin_habits_charts_type: chartist
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_from: 300
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%
          plugin_habits_trim: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 99
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_ignored: html,css
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 99
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_lines: yes
          plugin_lines_history_limit: 4
          plugin_lines_repositories_limit: 36
          plugin_lines_sections: base
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_topics: yes
          plugin_topics_limit: 20
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          repositories_forks: yes

          # ── WakaTime ──────────────────────────────────────────────────────
          # Do NOT uncomment until `curl .../stats/last_7_days` returns real
          # data. Your original commented block was also missing the token
          # line below, so it would have failed even if the data existed.
          # plugin_wakatime: yes
          # plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          # plugin_wakatime_days: 7
          # plugin_wakatime_limit: 5
          # plugin_wakatime_sections: time, languages, editors, os
          # plugin_wakatime_repositories_visibility: all
          # plugin_wakatime_url: https://wakatime.com
          # plugin_wakatime_user: n8fury

          # File output options
          filename: assets/github-metrics.svg
          config_output: svg
