name: Generate Snake Animation

# SLOT 3 of 3 — runs daily, but at 02:00 so it never lands inside the waka or
# metrics windows on the 1st / 8th / 15th / 22nd.
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      - name: Move snake.svg to assets folder
        run: |
          mkdir -p assets
          mv dist/snake.svg assets/snake.svg

      # Hardened: the original did a bare `git push origin main`, which fails
      # outright if anything landed on main since checkout. Rebase-and-retry
      # makes this job survive a collision instead of dying on it.
      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(assets): update snake animation"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

          echo "::error::Push failed after 3 attempts."
          exit 1
