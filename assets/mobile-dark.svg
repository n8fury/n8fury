<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1038" viewBox="0 0 600 1038" role="img">
<title>MD. Mamdud Hasan (n8fury) — Software Engineer at Zeroozen Energy. Backend, IoT and data systems for light electric vehicles.</title>
<desc>Terminal-style profile card: ASCII flame artwork with a neofetch-style listing of role, location, languages, stack, projects and coding activity.</desc>
<defs>
  <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop id="gs0" offset="0%" stop-color="#EF4444"/>
    <stop id="gs1" offset="100%" stop-color="#F97316"/>
  </linearGradient>
  <radialGradient id="bg" cx="30%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#151010"/>
    <stop offset="100%" stop-color="#0A0707"/>
  </radialGradient>
  <pattern id="tex" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#FCA5A5" opacity="0.04"/>
  </pattern>

  <style>
    .ascii  { font-family: 'Courier New', Consolas, Menlo, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 8.3px; fill: url(#ag); letter-spacing: -0.2px; }
    text    { font-family: 'Courier New', Consolas, Menlo, 'Liberation Mono', 'DejaVu Sans Mono', monospace; font-size: 19px; white-space: pre; }
    .key    { fill: #F97316; font-weight: bold; }
    .val    { fill: #E5E7EB; }
    .dim    { fill: #57534E; }
    .head   { fill: #EF4444; font-size: 20px; font-weight: bold; }
    .accent { fill: #10B981; font-weight: bold; }

    .mr { animation: rise .5s ease-out backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    .art { animation: fade 1.2s ease-out backwards; }
    @keyframes fade { from { opacity: 0; } }

    .f0 { animation: fk0 2.3s ease-in-out infinite; }
    .f1 { animation: fk1 3.1s ease-in-out infinite; }
    .f2 { animation: fk2 4.3s ease-in-out infinite; }
    @keyframes fk0 { 0%,100%{opacity:1} 28%{opacity:.70} 52%{opacity:.95} 76%{opacity:.80} }
    @keyframes fk1 { 0%,100%{opacity:1} 34%{opacity:.84} 68%{opacity:.93} }
    @keyframes fk2 { 0%,100%{opacity:1} 46%{opacity:.91} }

    #gs0 { animation: h0 9s linear infinite; }
    #gs1 { animation: h1 9s linear infinite; }
    @keyframes h0 { 0%,100%{stop-color:#EF4444} 33%{stop-color:#F97316} 66%{stop-color:#FBBF24} }
    @keyframes h1 { 0%,100%{stop-color:#F97316} 33%{stop-color:#FBBF24} 66%{stop-color:#EF4444} }

    @media (prefers-reduced-motion: reduce) {
      #revealbar, .lc, .mr, .art, .f0, .f1, .f2, #gs0, #gs1 {
        animation: none !important; transform: none !important; opacity: 1 !important;
      }
    }
  </style>
</defs>

<rect width="600" height="1038" fill="url(#bg)"/>
<rect width="600" height="1038" fill="url(#tex)"/>

